<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form for Programming Workshop</title>
</head>
<body>
    <section>
        <h2>Registration</h2>
        <!-- Using form element and id register.html to set the hyperlink from homepage-->
        <form  id="register.html" method="post" action="lab2_ExerA.html">
            <!-- Using type text for textbox -->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <label for="matric">Matric Number:</label>
            <input type="text" id="matric" name="matric"><br><br>

            <!-- Using type email for email input that contains @ -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <!-- Using radio buttons for year of study -->
            <label for="year">Year of Study:</label><br>
            <input type="radio" id="year1" name="year" value="1">
            <label for="year1">Year 1</label>

            <input type="radio" id="year2" name="year" value="2">
            <label for="year2">Year 2</label>

            <input type="radio" id="year3" name="year" value="3">
            <label for="year3">Year 3</label>

            <input type="radio" id="year4" name="year" value="4">
            <label for="year4">Year 4</label><br><br>

            <!-- Select Sessions  using checkboxes-->
            <label for="sessions">Select Sessions:</label><br>
            <input type="checkbox" id="session1" name="sessions" value="Session 1">
            <label for="session1">Session 1: Introduction to Programming</label><br>

            <input type="checkbox" id="session2" name="sessions" value="Session 2">
            <label for="session2">Session 2: Advanced Programming Techniques</label><br>

            <input type="checkbox" id="session3" name="sessions" value="Session 3">
            <label for="session3">Session 3: Hands-on Coding Exercises</label><br><br>

            <!-- Using drop down list -->
            <label for="program">Program of Study:</label>
            <select id="program" name="program">
                <option value="Computer Science">Computer Science</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Data Science">Science Marine</option>
            </select><br><br>

            <input type="submit" value="Register">
        </form>
    </section>
</body>
</html>
