<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Campus Bookstore</title>
    <!-- Step 8: Loaded both Roboto and Merriweather in a single Google Fonts link -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
    <style>
        h1 { text-align: center; }
    </style>
</head>
<body>

    <!-- Step 5: Header section containing the main title -->
    <header>
        <h1>Campus Bookstore</h1>
    </header>

    <!-- Step 5 & 6: Navigation bar with .active class on Home -->
    <nav>
        <ul>
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Step 5: Main content area -->
    <main>
        <p>Textbooks, stationery and more for every student.</p>

        <table id="products">
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price (RM)</th>
            </tr>
            <tr>
                <td>Web Design Basics</td>
                <td>Textbook</td>
                <td>45.00</td>
            </tr>
            <tr>
                <td>A4 Notebook</td>

                <td>6.50</td>
            </tr>
            <tr>
                <td>USB Drive 32GB</td>
                <td>Gadget</td>
                <td>25.00</td>
            </tr>
            <tr>
                <td>Highlighter Set</td>
                <td>Stationery</td>
                <td>9.90</td>
            </tr>
        </table>
    </main>

    <!-- Step 5 & 9: Footer section -->
    <footer>&copy; 2026 Campus Bookstore</footer>
</body>
</html>
