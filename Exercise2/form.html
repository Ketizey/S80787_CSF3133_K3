<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="labexercise2.html" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>

        <label for="email" >Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="hobbies">Hobbies:</label><br>
        <input type="checkbox" id="hobby1" name="hobby" value="Futsal">
        <label for="hobby1">Futsal</label><br>

        <input type="checkbox" id="hobby2" name="hobby" value="Football">
        <labe for="hobby2">Football</label><br>

        <input type="checkbox" id="hobby3" name="hobby" value="Badminton">
        <label for="hobby3">Badminton</label><br><br>

        <input type="submit" value="Go to Table Page">
    </form>
    
</body>
</html>
